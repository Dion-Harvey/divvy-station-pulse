name: station-pulse-pipeline

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:          # manual runs for testing

permissions:
  contents: write

# No concurrency group on purpose. GitHub allows only one *pending* run per
# group, so when the hosted-runner queue backs up a third scheduled run
# cancels the second — reported as "Run failed: All jobs were cancelled" and
# emailed, despite nothing being wrong. Artifacts are force-pushed and each
# run refetches current state, so overlapping runs are harmless: the later
# push simply wins.

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet duckdb

      - name: Restore rolling history from data branch
        run: |
          mkdir -p out
          curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/data/history.json" -o out/history.json || echo "no prior history (first run)"

      - name: Run pipeline (ingest -> validate -> transform -> emit)
        run: python pipeline/run.py

      - name: Publish artifacts to data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "station-pulse-bot"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "pipeline run $(date -u +%FT%TZ)"
          # GitHub occasionally rejects pushes server-side ("fatal error in
          # commit_refs"); a few seconds later the same push succeeds. Retry
          # with backoff so a transient rejection doesn't fail the run.
          remote="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            if git push -q --force "$remote" data; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "push attempt $attempt failed; retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::push to data branch failed after 3 attempts"
          exit 1
